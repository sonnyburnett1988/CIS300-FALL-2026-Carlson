<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lemon grove</title>
  <style>
    html, body { height: 100%; margin: 0; }


    body 
    {     
        background-image: url("starsky.gif");
        background-attachment: fixed;
        background-color:var(--span-bg);
        font-size:16px;
        font-weight: bold;
        color:#302C30;
        position: relative;
    }

    .content 
    {
        margin: 0px;
        width:1500px;
        height:50px;
    }

    .container 
    {
        position: relative;
        text-align: center;
        color: white;
    }

    .centered 
    {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    .image-hover 
    {
        width: 130px; 
        height: 200px; 
        background-image: url(pics/door1.png); 
        background-size: cover; 
        transition: background-image 0.0s ease-in-out; 
    }

    .image-hover:hover 
    {
        background-image: url(pics/door2.png); 
    
    }
    
    a 
    {
        display: block;
    }
  

    </style>
  </head>
  <body>
  <div class="content">
  <section class="container">
  <img src="11-lemon-png-image.png" style="width:40%;">
  <div class="centered">
  <section class="container">
  <a href="home.html"><div class="image-hover"></div></a>
  </section>
  </div>
  </section>
    

</div>

    

    

    
  </body>
</html>
